services:
  spotify-rpm-packager:
    container_name: spotify-rpm-packager
    image: spotify-rpm-packager:latest
    build:
      dockerfile: dockerfile
      context: .
    env_file: .env
    privileged: True
    ports:
      - ${REPO_PORT:-80}:${REPO_PORT:-80}
    volumes:
      - ./data:/data
      - ./gpg-key:/gpg-key
      - ./logs:/logs